[workspace]
resolver = "2"
members = ["crates/nira-core", "crates/nira"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
homepage = "https://github.com/lokdevp/nira"
repository = "https://github.com/lokdevp/nira"

[workspace.dependencies]
nira-core = { path = "crates/nira-core" }
gdk-pixbuf = "0.20"
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "pnm", "tga",
] }
# JPEG 2000 pages. Without the `image` feature: it pulls in moxcms (ICC
# colour management), which comic scans don't need.
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["std", "simd"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
codegen-units = 1

# Debug builds are used interactively; optimize dependencies (image resize
# lives in the image crate) so the debug binary is usable while keeping the
# project's own code mostly unoptimized for fast iteration.
[profile.dev.package."*"]
opt-level = 2
