name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The release job creates the GitHub Release and generates release notes,
# which requires write access to contents.
permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb + tarball)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libgdk-pixbuf-2.0-dev \
            libpango1.0-dev libcairo2-dev libglib2.0-dev liblzma-dev libbz2-dev \
            desktop-file-utils shared-mime-info

      - name: Build (release)
        run: cargo build --release

      - name: Run tests
        run: cargo test --workspace --release

      - name: Build .deb with cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: cargo deb
        run: cargo deb -p nira

      - name: Create standalone tarball
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          NAME="nira-${VERSION}-linux-x86_64"
          DIR="dist/tar/$NAME"
          mkdir -p "$DIR/bin" "$DIR/share/applications" "$DIR/share/icons"
          cp target/release/nira "$DIR/bin/"
          cp packaging/linux/io.github.lokdevp.Nira.desktop "$DIR/share/applications/"
          cp -r packaging/linux/icons "$DIR/share/icons/hicolor"
          cp packaging/linux/INSTALL-tarball.txt "$DIR/INSTALL.txt"
          tar czf "dist/$NAME.tar.gz" -C dist/tar "$NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/debian/*.deb
            dist/*.tar.gz

  appimage:
    name: AppImage (Linux standalone)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libgdk-pixbuf-2.0-dev \
            libpango1.0-dev libcairo2-dev libglib2.0-dev liblzma-dev libbz2-dev \
            librsvg2-common dconf-gsettings-backend \
            desktop-file-utils file curl

      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage

  windows-cross:
    name: Windows (cross-compiled from Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis zip zstd curl pkg-config libglib2.0-bin

      - name: Cross-compile + bundle + installer
        run: bash packaging/windows/cross-build-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  release:
    name: Publish GitHub Release
    # Windows is built above (download it from the run page to test) but is
    # not released until it has been tested, so the release doesn't wait on it.
    needs: [linux, appimage]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    # Job-level permissions replace the workflow-level ones, so contents is
    # repeated here.
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation through Sigstore (OIDC)
      attestations: write  # store the attestation
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: artifacts/linux
      - uses: actions/download-artifact@v8
        with:
          name: appimage
          path: artifacts/appimage
      - name: Write SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.AppImage' \) \
            -exec sha256sum {} + | sed 's|  .*/|  |' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      # Records that each file in SHA256SUMS was built by this workflow from
      # this commit. Users check it with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
